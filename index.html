<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TurfDraft</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:16px}.card,.team{background:#142238;border:1px solid #2b3e5b;border-radius:16px;padding:18px;margin:12px 0}.grid,.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px;color:#b8c7da}input,textarea,select{width:100%;box-sizing:border-box;background:#0b1626;color:#fff;border:1px solid #38506e;border-radius:9px;padding:11px;font:inherit}textarea{min-height:130px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#38bdf8;color:#06111c}.secondary{background:#2a3b55;color:#fff}.danger{background:#ef4444;color:#fff}.hidden{display:none}.muted{color:#a8b7cc}.turn{font-size:20px;font-weight:800;color:#67e8f9}.player{display:flex;justify-content:space-between;gap:8px;background:#22334b;padding:9px;border-radius:8px;margin:6px 0}.pick{background:#38bdf8;color:#06111c;padding:7px 10px}.error{background:#451b22;border:1px solid #8b303b;color:#ffd7dc;padding:10px;border-radius:9px;margin:10px 0}.active{border-color:#38bdf8}@media(max-width:600px){main{padding:9px}}</style></head><body><main>
<section id="setup" class="card"><h1>🏆 TurfDraft</h1><p class="muted">Live tournament with Supabase database + Realtime.</p><div id="error" class="error hidden"></div>
<div class="grid"><div><label>Tournament name</label><input id="tournamentName" value="Sunday Turf"></div><div><label>Number of teams</label><input id="teamCount" type="number" min="2" max="16" value="2"></div></div>
<label>Teams — Team Name | Captain</label><textarea id="teamsInput">Mumbai Strikers | Suraj
Thane Warriors | Manish</textarea><label>Players — one per line</label><textarea id="playersInput" placeholder="Aditya&#10;Shubham&#10;Rahul&#10;Amit&#10;Rohit&#10;Kunal"></textarea><br><button id="create" class="primary">Create Live Tournament</button></section>
<section id="join" class="card hidden"><h2>Join Tournament</h2><p id="joinInfo" class="muted"></p><label>Your name</label><input id="joinName"><label>Role</label><select id="joinRole"><option value="spectator">Player / Spectator</option></select><br><br><button id="joinBtn" class="primary">Join</button></section>
<section id="draft" class="hidden"><div class="card"><h1 id="title"></h1><p id="meta" class="muted"></p><p id="status" class="turn"></p><span id="connection" class="muted">● Live</span><span id="left"></span><br><br><button id="copy" class="secondary">Copy Room URL</button></div><div class="card"><h2>Available Players</h2><div id="available"></div></div><div id="teamsView" class="teams"></div><div class="card"><button id="undo" class="danger">Undo</button> <button id="reset" class="secondary">Reset</button></div></section>
<script type="module" src="./app.js"></script></main></body></html>
